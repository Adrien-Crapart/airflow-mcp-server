name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run unit tests
        run: |
          pytest -k "not integration" -q

  openapi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Export OpenAPI JSON
        run: |
          python - <<'PY'
          import json
          from airflow_mcp_server.server import create_app
          app = create_app()
          open('openapi.json','w').write(json.dumps(app.openapi(), indent=2))
          PY
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Start Airflow 3 service
        run: |
          docker run -d --name airflow_ci -p 8080:8080 \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=True \
            apache/airflow:3.0.2 airflow standalone

      - name: Wait for Airflow and fetch API token
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..120}; do
            ADMIN_PASSWORD="$(docker logs airflow_ci 2>&1 | sed -n "s/.*Password for user 'admin': //p" | tail -n 1 | tr -d '\r')"
            if [[ -n "${ADMIN_PASSWORD}" ]]; then
              HEALTH_STATUS="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)"
              if [[ "${HEALTH_STATUS}" == "200" ]]; then
                TOKEN="$(curl -sS -X POST http://127.0.0.1:8080/auth/token \
                  -H 'Content-Type: application/json' \
                  -d "{\"username\":\"admin\",\"password\":\"${ADMIN_PASSWORD}\"}" \
                  | python -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)"
                if [[ -n "${TOKEN}" ]]; then
                  {
                    echo "AIRFLOW_BASE_URL=http://127.0.0.1:8080"
                    echo "AIRFLOW_USERNAME="
                    echo "AIRFLOW_PASSWORD="
                    echo "AIRFLOW_API_TOKEN=${TOKEN}"
                    echo "AIRFLOW_INTEGRATION_ALLOW_MOCK_FALLBACK=false"
                  } >> "${GITHUB_ENV}"
                  exit 0
                fi
              fi
            fi
            sleep 5
          done

          echo "Airflow did not become ready in time" >&2
          docker logs airflow_ci | tail -n 200
          exit 1

      - name: Run integration tests against real Airflow
        run: |
          pytest tests/integration -q -rs

      - name: Show Airflow logs on failure
        if: failure()
        run: |
          docker logs airflow_ci | tail -n 200 || true

      - name: Stop Airflow
        if: always()
        run: |
          docker rm -f airflow_ci || true

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: airflow-mcp-server:ci
      - name: Run container and smoke test
        run: |
          docker run -d --rm --name mcp_ci -p 8001:8000 airflow-mcp-server:ci
          # wait for startup
          sleep 3
          curl -f http://localhost:8001/health
